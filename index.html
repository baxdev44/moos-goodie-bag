<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moos Goodie Bag - Gift Picker</title>
    <style>
        body { font-family: 'Avenir', Helvetica, Arial, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; width: 380px; margin: 20px; }
        .hat { font-size: 100px; cursor: pointer; transition: 0.3s; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1)); margin-bottom: 20px; }
        .hat:hover { transform: scale(1.1) rotate(-5deg); }
        .hat.disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 2px solid #eee; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        button { background: #333; color: white; border: none; padding: 14px 24px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 1rem; }
        #result { margin-top: 20px; color: #2c3e50; min-height: 100px; line-height: 1.5; }
        .gift-title { color: #e74c3c; font-size: 1.3rem; font-weight: bold; display: block; margin-bottom: 10px; }
        .gift-desc { font-size: 0.95rem; color: #555; font-style: italic; display: block; }
        .hidden { display: none; }
        #counter { margin-top: 20px; font-size: 0.85rem; color: #95a5a6; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen">
        <h2>Moos Goodie Bag</h2>
        <p>Gift Picker</p>
        <input type="text" id="userName" placeholder="Enter your name">
        <button onclick="enterApp()">Join Draw</button>
    </div>

    <div id="draw-screen" class="hidden">
        <h3 id="greeting"></h3>
        <div id="hatIcon" class="hat" onclick="pickChit()">🎩</div>
        <div id="result">Tap the hat to reveal your gift</div>
        <p id="counter"></p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get, set, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCaZPkub3eDJfLJ1CJldNIy-zMolKn3Wlo",
        authDomain: "moos-goodie-bag.firebaseapp.com",
        databaseURL: "https://moos-goodie-bag-default-rtdb.firebaseio.com",
        projectId: "moos-goodie-bag",
        storageBucket: "moos-goodie-bag.firebasestorage.app",
        messagingSenderId: "1092557866155",
        appId: "1:1092557866155:web:492ca076c50378e6c563ee",
        measurementId: "G-0Q2GEW9CXF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const chitsRef = ref(db, 'hat/availableChits');

    const initialChits = [
        { title: "Something for the Skin", desc: "A focused facial treatment or premium skincare essential designed for a moment of deep pampering. ✨ This gift ensures her skin stays radiant and refreshed throughout the wedding festivities. 🧖‍♀️" },
        { title: "Something for the Body", desc: "A luxury body care treat designed for total relaxation. 🛁 Whether it’s for a long soak or post-shower hydration, this category focuses on making her daily routine feel like a high-end ritual. 🧴" },
        { title: "Something for the Honeymoon (Pleasure)", desc: "A playful addition to the bedroom to spice things up. 🔥 This is the perfect opportunity to gift a high-quality intimacy toy or some cheeky handcuffs to ensure the post-wedding getaway is extra memorable. 😉" },
        { title: "Something for the Boudoir (Lingerie)", desc: "A single, high-quality garment that feels sophisticated and special. 🫦 Rather than a full set, this focuses on one standout piece that makes her feel beautiful and confident. 💃" },
        { title: "Something for the Tresses (Hair)", desc: "A premium hair care treat or luxury styling tool to keep her locks looking their best. 💇‍♀️ This category is all about maintaining shine and health from the engagement party to the big day. ✨" },
        { title: "Something for the Smell (Fragrance)", desc: "A signature scent or luxury perfume that leaves a lasting impression. 🌸 This gift adds a touch of elegance and mystery to her daily routine, perfect for creating wedding memories. ☁️" },
        { title: "Something Blue", desc: "An homage to the classic bridal tradition symbolizing love and fidelity. 💎 Think of a subtle accessory, a piece of delicate jewelry, or a hidden detail to bring her luck. 💙" },
        { title: "Something for Nails", desc: "A gift voucher to a neighborhood nail spa for essential pre-wedding pampering. 💅 This ensures she has a polished look for the ceremony and a moment of calm. ✨" },
        { title: "Something for Home", desc: "A thoughtful addition to her living space that creates a serene atmosphere. 🏠 This category focuses on setting the mood at home, helping her unwind in her Long Island residence. 🕯️" },
        { title: "Something for the Glow (Makeup)", desc: "A luxe makeup gift or illuminating highlight that brings an extra glow. 💄 This is the finishing touch to help her feel her most luminous during all her celebratory appearances. ✨" }
    ];

    const specialAssignments = {
        "Bhakti": "Something for the Smell (Fragrance)",
        "Alisha": "Something for the Boudoir (Lingerie)",
        "Michaela": "Something for the Boudoir (Lingerie)",
        "Alisha and Michaela": "Something for the Boudoir (Lingerie)",
        "Michaela and Alisha": "Something for the Boudoir (Lingerie)"
    };

    let currentUser = "";

    window.enterApp = async function() {
        const nameInput = document.getElementById('userName').value.trim();
        if (!nameInput) return alert("Please enter your name!");
        currentUser = nameInput;
        
        const snapshot = await get(chitsRef);
        if (!snapshot.exists()) {
            await set(chitsRef, initialChits);
        }

        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('draw-screen').classList.remove('hidden');
        document.getElementById('greeting').innerText = `Hello, ${currentUser}!`;
        updateCounter();
    };

    window.pickChit = async function() {
        const hat = document.getElementById('hatIcon');
        const resultDiv = document.getElementById('result');

        runTransaction(chitsRef, (currentChits) => {
            if (!currentChits || currentChits.length === 0) return currentChits;

            let pickedObj = null;
            let indexToRemove = -1;
            const assignedTitle = specialAssignments[currentUser];
            
            if (assignedTitle && currentChits.some(c => c.title === assignedTitle)) {
                indexToRemove = currentChits.findIndex(c => c.title === assignedTitle);
                pickedObj = currentChits[indexToRemove];
            } else {
                const reservedTitles = Object.values(specialAssignments);
                const trulyRandomPool = currentChits.filter(c => !reservedTitles.includes(c.title));
                
                let selectedFrom = trulyRandomPool.length > 0 ? trulyRandomPool : currentChits;
                indexToRemove = currentChits.indexOf(selectedFrom[Math.floor(Math.random() * selectedFrom.length)]);
                pickedObj = currentChits[indexToRemove];
            }

            if (indexToRemove > -1) {
                currentChits.splice(indexToRemove, 1);
                hat.setAttribute('data-last-title', pickedObj.title);
                hat.setAttribute('data-last-desc', pickedObj.desc);
                return currentChits;
            }
        }).then(async () => {
            const title = hat.getAttribute('data-last-title');
            const desc = hat.getAttribute('data-last-desc');
            
            if (title) {
                const selectionRef = ref(db, 'selections/' + currentUser);
                await set(selectionRef, {
                    name: currentUser,
                    gift: title,
                    timestamp: new Date().toLocaleString()
                });

                resultDiv.innerHTML = `<span class="gift-title">${title}</span><span class="gift-desc">${desc}</span>`;
                hat.classList.add('disabled');
                updateCounter();
            }
        });
    };

    async function updateCounter() {
        const snapshot = await get(chitsRef);
        const count = snapshot.exists() ? snapshot.val().length : 0;
        document.getElementById('counter').innerText = `${count} gifts remaining in the hat.`;
    }
</script>

</body>
</html>
